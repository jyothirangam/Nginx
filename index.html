<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinemaGo · Book Tickets</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- GLOBAL STYLES ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 30%, #1a1f2e, #0b0e16);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* main card – softer, more spacious */
    .booking-container {
      max-width: 1150px;
      width: 100%;
      background: rgba(18, 24, 38, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 48px;
      padding: 32px 36px;
      box-shadow: 0 35px 60px -15px #000000e0, 0 0 0 1px #ffffff0d;
      border: 1px solid #ffffff12;
      transition: all 0.2s;
    }

    /* ---------- TYPOGRAPHY & HEADER ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .brand i {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ffd966, #f5b81b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .tagline {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a8b6d1;
      font-size: 0.95rem;
      font-weight: 400;
      padding-bottom: 24px;
      border-bottom: 1px solid #ffffff12;
      margin-bottom: 28px;
    }

    .tagline i {
      color: #ffd966;
      font-size: 1rem;
    }

    /* ---------- SECTION TITLES (with better hierarchy) ---------- */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.05rem;
      color: #e3eaf9;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .section-title i {
      color: #ffd966;
      font-size: 1.1rem;
      width: 22px;
      text-align: center;
    }

    /* ---------- MOVIE CARDS – bigger, clearer ---------- */
    .movie-grid {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .movie-card {
      flex: 1;
      min-width: 160px;
      background: #1b2236;
      border-radius: 28px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      box-shadow: 0 8px 16px -4px #00000060;
    }

    .movie-card i {
      font-size: 2.6rem;
      margin-bottom: 12px;
      color: #8392b0;
      transition: 0.2s;
    }

    .movie-card h3 {
      color: #f0f4fe;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .movie-card p {
      color: #a0aec9;
      font-size: 0.75rem;
      background: #ffffff0a;
      padding: 5px 12px;
      border-radius: 40px;
      letter-spacing: 0.2px;
    }

    .movie-card.selected {
      border-color: #ffd966;
      background: #222d4a;
      transform: translateY(-3px);
      box-shadow: 0 18px 28px -12px #ffd96670;
    }

    .movie-card.selected i {
      color: #ffd966;
    }

    /* ---------- DATE & TIME – pill style, easier to tap ---------- */
    .datetime-row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .picker-group {
      flex: 1;
      min-width: 240px;
    }

    .pill-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: #1b2236;
      border: none;
      color: #ccd9f0;
      padding: 12px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 78px;
      box-shadow: 0 6px 12px -6px #00000080;
      border: 1px solid #ffffff0a;
      line-height: 1.3;
    }

    .pill-btn span {
      font-size: 0.7rem;
      opacity: 0.75;
      margin-top: 3px;
      font-weight: 400;
    }

    .pill-btn:hover {
      background: #28324e;
      transform: scale(1.02);
    }

    .pill-btn.active {
      background: #ffd966;
      color: #0d1220;
      font-weight: 700;
      box-shadow: 0 14px 20px -8px #ffd966cc;
      border-color: #ffd966;
    }

    .pill-btn.active span {
      color: #1f263a;
      opacity: 0.9;
      font-weight: 500;
    }

    /* ---------- SCREEN – more modern, with glow ---------- */
    .screen-area {
      margin: 10px 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      width: 75%;
      max-width: 620px;
      height: 44px;
      background: linear-gradient(to bottom, #cdd9ed, #7888a8);
      border-radius: 0 0 40px 40px;
      box-shadow: 0 18px 28px -10px #000000b3, 0 0 0 1px #ffffff30;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f1629;
      font-weight: 700;
      letter-spacing: 8px;
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 28px;
      position: relative;
    }

    .screen::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 80%;
      height: 6px;
      background: radial-gradient(ellipse at center, #ffd96660, transparent 80%);
      filter: blur(4px);
    }

    /* ---------- SEATS – larger, more comfortable ---------- */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      justify-content: center;
      max-width: 650px;
      margin: 0 auto 10px;
    }

    .seat {
      background: #1b2236;
      aspect-ratio: 1 / 0.95;
      border-radius: 14px 14px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a9b7d4;
      cursor: pointer;
      transition: all 0.1s ease;
      box-shadow: 0 4px 8px -4px #00000080;
      border: 1px solid #ffffff0f;
      letter-spacing: 0.3px;
    }

    .seat:hover:not(.occupied) {
      background: #2f3c5e;
      color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 0 0 2px #ffd96640;
    }

    .seat.selected {
      background: #ffd966;
      color: #0a0f1c;
      font-weight: 700;
      box-shadow: 0 0 16px #ffd966cc, 0 0 0 2px #ffe8a3;
      border-color: #ffdd88;
    }

    .seat.occupied {
      background: #262c3f;
      color: #555f78;
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: none;
      pointer-events: none;
      text-decoration: line-through;
      font-weight: 400;
      border-color: #ffffff05;
    }

    /* ---------- LEGEND – clean and aligned ---------- */
    .legend {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 20px 0 22px;
      color: #b3c0d8;
      font-size: 0.85rem;
      font-weight: 400;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 20px;
      height: 20px;
      border-radius: 8px;
      background: #1b2236;
      border: 1px solid #ffffff20;
    }

    .legend-box.selected {
      background: #ffd966;
      border-color: #ffdd88;
    }

    .legend-box.occupied {
      background: #262c3f;
      border-color: #ffffff08;
    }

    /* ---------- SUMMARY BAR – bold, friendly, with clear CTA ---------- */
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121a2c;
      padding: 16px 28px;
      border-radius: 80px;
      margin-top: 16px;
      flex-wrap: wrap;
      gap: 18px;
      border: 1px solid #ffffff14;
      box-shadow: inset 0 2px 6px #00000060, 0 12px 24px -12px #000000;
    }

    .summary-info {
      display: flex;
      gap: 36px;
      flex-wrap: wrap;
      align-items: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      color: #9fb0ce;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }

    .summary-item strong {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-item strong i {
      color: #ffd966;
      font-size: 1.1rem;
    }

    .book-btn {
      background: #ffd966;
      border: none;
      color: #0d1220;
      padding: 15px 36px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 14px 26px -8px #ffd966b0;
      letter-spacing: 0.2px;
    }

    .book-btn:hover {
      background: #ffe08a;
      transform: scale(1.02);
      box-shadow: 0 20px 30px -8px #ffd966;
    }

    .book-btn:active {
      transform: scale(0.97);
    }

    .book-btn i {
      font-size: 1.2rem;
    }

    /* ---------- TOAST – subtle but noticeable ---------- */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #1b2236;
      color: #f0f6ff;
      padding: 16px 32px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 25px 40px -10px #000000e0;
      border-left: 6px solid #ffd966;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1), opacity 0.2s;
      pointer-events: none;
      z-index: 999;
      font-weight: 500;
      backdrop-filter: blur(12px);
      background: rgba(27, 34, 54, 0.96);
      font-size: 0.95rem;
      max-width: 90vw;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast i {
      color: #ffd966;
      font-size: 1.4rem;
    }

    /* ---------- RESPONSIVE TWEAKS ---------- */
    @media (max-width: 750px) {
      .booking-container {
        padding: 24px 18px;
        border-radius: 32px;
      }
      .brand h1 {
        font-size: 1.8rem;
      }
      .brand i {
        font-size: 1.9rem;
      }
      .seats-grid {
        gap: 6px;
      }
      .seat {
        font-size: 0.65rem;
      }
      .summary {
        justify-content: center;
        padding: 18px 20px;
      }
      .book-btn {
        width: 100%;
        justify-content: center;
      }
      .summary-info {
        gap: 24px;
        justify-content: center;
        width: 100%;
      }
    }

    @media (max-width: 500px) {
      .seat {
        font-size: 0.55rem;
        border-radius: 8px;
      }
      .legend {
        gap: 16px;
        font-size: 0.75rem;
      }
      .pill-btn {
        padding: 10px 12px;
        min-width: 68px;
        font-size: 0.8rem;
      }
      .movie-card h3 {
        font-size: 0.95rem;
      }
      .movie-card i {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="booking-container">
    <!-- Header -->
    <div class="brand">
      <i class="fas fa-film"></i>
      <h1>CinemaGo</h1>
    </div>
    <div class="tagline">
      <i class="fas fa-ticket-alt"></i> Choose movie, date, showtime & seats — easy.
    </div>

    <!-- Movie selection (bigger, clearer) -->
    <div class="section-title"><i class="fas fa-video"></i> Now showing</div>
    <div class="movie-grid" id="movieGrid">
      <div class="movie-card selected" data-movie="Dune: Part Two" data-price="12">
        <i class="fas fa-meteor"></i>
        <h3>Dune: Part Two</h3>
        <p>Sci-Fi · 2h 46m</p>
      </div>
      <div class="movie-card" data-movie="Oppenheimer" data-price="12">
        <i class="fas fa-atom"></i>
        <h3>Oppenheimer</h3>
        <p>Biography · 3h</p>
      </div>
      <div class="movie-card" data-movie="The Batman" data-price="10">
        <i class="fas fa-mask"></i>
        <h3>The Batman</h3>
        <p>Action · 2h 56m</p>
      </div>
    </div>

    <!-- Date & time (pill style) -->
    <div class="datetime-row">
      <div class="picker-group">
        <div class="section-title"><i class="fas fa-calendar-alt"></i> Pick a date</div>
        <div class="pill-options" id="dateOptions">
          <button class="pill-btn active" data-date="Today">Today <span>Oct 12</span></button>
          <button class="pill-btn" data-date="Tomorrow">Tomorrow <span>Oct 13</span></button>
          <button class="pill-btn" data-date="Sunday">Sunday <span>Oct 14</span></button>
        </div>
      </div>
      <div class="picker-group">
        <div class="section-title"><i class="fas fa-clock"></i> Showtime</div>
        <div class="pill-options" id="timeOptions">
          <button class="pill-btn active" data-time="14:30">14:30 <span>PM</span></button>
          <button class="pill-btn" data-time="18:00">18:00 <span>PM</span></button>
          <button class="pill-btn" data-time="21:15">21:15 <span>PM</span></button>
        </div>
      </div>
    </div>

    <!-- Screen + seats -->
    <div class="screen-area">
      <div class="screen">SCREEN</div>
      <div class="seats-grid" id="seatsGrid"></div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><div class="legend-box"></div> Available</div>
      <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
      <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
    </div>

    <!-- Summary & Book -->
    <div class="summary">
      <div class="summary-info">
        <div class="summary-item">
          <span><i class="fas fa-chair"></i> Seats</span>
          <strong id="seatCount">0</strong>
        </div>
        <div class="summary-item">
          <span><i class="fas fa-tag"></i> Total</span>
          <strong><i class="fas fa-dollar-sign"></i><span id="totalPrice">0</span></strong>
        </div>
        <div class="summary-item">
          <span><i class="fas fa-clock"></i> Show</span>
          <strong id="selectedShow">Today 14:30</strong>
        </div>
      </div>
      <button class="book-btn" id="bookBtn"><i class="fas fa-check-circle"></i> Book now</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMsg">Booking confirmed!</span>
  </div>

  <script>
    (function(){
      // ----- STATE -----
      let currentMovie = { name: 'Dune: Part Two', price: 12 };
      let selectedDate = 'Today';
      let selectedTime = '14:30';
      let selectedSeats = new Set();

      // ----- DOM -----
      const movieCards = document.querySelectorAll('.movie-card');
      const dateBtns = document.querySelectorAll('#dateOptions .pill-btn');
      const timeBtns = document.querySelectorAll('#timeOptions .pill-btn');
      const seatsGrid = document.getElementById('seatsGrid');
      const seatCountSpan = document.getElementById('seatCount');
      const totalPriceSpan = document.getElementById('totalPrice');
      const selectedShowSpan = document.getElementById('selectedShow');
      const bookBtn = document.getElementById('bookBtn');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      // ----- CONSTANTS -----
      const ROWS = ['A', 'B', 'C', 'D', 'E', 'F'];
      const SEATS_PER_ROW = 10;
      const OCCUPIED_SEATS = new Set([
        'A3','A4','A5','B7','B8','C2','C9','D1','D10','E4','E5','F6','F7','F8'
      ]);

      // ----- GENERATE SEATS (with better UX: clear labels & touch-friendly) -----
      function generateSeats() {
        seatsGrid.innerHTML = '';
        ROWS.forEach(row => {
          for (let i = 1; i <= SEATS_PER_ROW; i++) {
            const seatId = `${row}${i}`;
            const seatDiv = document.createElement('div');
            seatDiv.className = 'seat';
            if (OCCUPIED_SEATS.has(seatId)) {
              seatDiv.classList.add('occupied');
            }
            seatDiv.dataset.seat = seatId;
            seatDiv.textContent = seatId;
            if (selectedSeats.has(seatId)) {
              seatDiv.classList.add('selected');
            }
            seatDiv.addEventListener('click', () => toggleSeat(seatId, seatDiv));
            seatsGrid.appendChild(seatDiv);
          }
        });
      }

      // ----- TOGGLE SEAT -----
      function toggleSeat(seatId, seatElement) {
        if (seatElement.classList.contains('occupied')) return;
        
        if (selectedSeats.has(seatId)) {
          selectedSeats.delete(seatId);
          seatElement.classList.remove('selected');
        } else {
          selectedSeats.add(seatId);
          seatElement.classList.add('selected');
        }
        updateSummary();
      }

      // ----- UPDATE SUMMARY (count, price, show) -----
      function updateSummary() {
        const count = selectedSeats.size;
        seatCountSpan.textContent = count;
        const total = count * currentMovie.price;
        totalPriceSpan.textContent = total;
        
        let dateDisplay = selectedDate === 'Today' ? 'Today' :
                         selectedDate === 'Tomorrow' ? 'Tomorrow' : 'Sunday';
        selectedShowSpan.textContent = `${dateDisplay} ${selectedTime}`;
      }

      // ----- RESET SEATS -----
      function clearSelectedSeats() {
        selectedSeats.clear();
        document.querySelectorAll('.seat.selected').forEach(seat => {
          seat.classList.remove('selected');
        });
        updateSummary();
      }

      // ----- SET MOVIE -----
      function setMovie(name, price) {
        currentMovie = { name, price };
        updateSummary();
      }

      // ----- MOVIE CARD CLICK -----
      movieCards.forEach(card => {
        card.addEventListener('click', () => {
          movieCards.forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          const movie = card.dataset.movie;
          const price = parseFloat(card.dataset.price);
          setMovie(movie, price);
        });
      });

      // ----- DATE BUTTONS -----
      dateBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          dateBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedDate = btn.dataset.date;
          updateSummary();
        });
      });

      // ----- TIME BUTTONS -----
      timeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          timeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedTime = btn.dataset.time;
          updateSummary();
        });
      });

      // ----- BOOK BUTTON -----
      bookBtn.addEventListener('click', () => {
        if (selectedSeats.size === 0) {
          showToast('Please select at least one seat.', 'fa-exclamation-circle');
          return;
        }
        
        const seatList = Array.from(selectedSeats).join(', ');
        const total = selectedSeats.size * currentMovie.price;
        const movieName = currentMovie.name;
        const showTime = `${selectedDate} ${selectedTime}`;
        
        showToast(`✅ ${selectedSeats.size} seat(s) booked for "${movieName}" (${showTime}) — $${total}`, 'fa-check-circle');
        
        clearSelectedSeats();
      });

      // ----- TOAST -----
      let toastTimer;
      function showToast(message, iconClass = 'fa-check-circle') {
        toastMsg.textContent = message;
        const icon = toast.querySelector('i');
        icon.className = `fas ${iconClass}`;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 3200);
      }

      // ----- INIT -----
      function init() {
        generateSeats();
        const defaultCard = document.querySelector('.movie-card.selected');
        if (defaultCard) {
          currentMovie = {
            name: defaultCard.dataset.movie,
            price: parseFloat(defaultCard.dataset.price)
          };
        }
        selectedDate = 'Today';
        selectedTime = '14:30';
        updateSummary();
      }

      init();
    })();
  </script>
</body>
</html>
